# =============================================================================
# ESP32-C3 hardware overlay (Seeed Studio XIAO ESP32-C3)
# -----------------------------------------------------------------------------
# Fork-only file: applies the XIAO ESP32-C3 hardware delta on top of the
# UNTOUCHED upstream packages (everything-presence-lite-base.yaml,
# ld2450-base.yaml). Keep ONLY hardware differences here so that
# `git merge upstream/main` stays conflict-free.
#
# Pin map (XIAO ESP32-C3 vs original EP Lite ESP32):
#   I2C SDA/SCL : 6/7   (was 21/22)
#   Status LED  : GPIO4 (was GPIO14)
#   LD2450 UART : TX GPIO21 / RX GPIO20 (was 17/16)
# =============================================================================

esphome:
  platformio_options:
    board_build.flash_mode: dio
    board_build.mcu: esp32c3

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf
    # sram1_as_iram (set upstream) is ESP32-classic only
    advanced: !remove

i2c:
  - id: !extend bus_a
    sda: 6
    scl: 7

light:
  - id: !extend esp32_led
    pin: GPIO4

uart:
  tx_pin:
    number: GPIO21
    mode:
      input: true
      pullup: true
  rx_pin:
    number: GPIO20
    mode:
      input: true
      pullup: true

# The upstream flash/factory-reset button sits on GPIO0 with
# ignore_strapping_warning: true (GPIO0 IS a strapping pin on the classic
# ESP32). On the C3 the strapping pins are GPIO2/8/9, so that flag makes
# validation fail ("GPIO0 is not a strapping pin") and must be overridden.
binary_sensor:
  - id: !extend flash_button
    pin:
      number: 0
      inverted: true
      ignore_strapping_warning: false

# Alternative: on the XIAO the BOOT button is GPIO9 (which IS strapping on
# the C3). To use it instead of GPIO0, replace the pin above with:
#     pin:
#       number: 9
#       inverted: true
#       ignore_strapping_warning: true
#       mode:
#         input: true
#         pullup: true
